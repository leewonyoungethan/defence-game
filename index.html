<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>디펜스 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a; color: #e2e8f0;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px; user-select: none;
  }
  h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: 1px; }
  #wrap { width: 100%; max-width: 960px; }
  #hud {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: #1e293b; border-radius: 10px 10px 0 0; padding: 8px 12px;
  }
  .stat { font-size: 16px; font-weight: 600; margin-right: 10px; }
  .spacer { flex: 1; }
  button {
    background: #334155; color: #e2e8f0; border: 2px solid #475569;
    border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:hover:not(:disabled) { background: #475569; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #16a34a; border-color: #22c55e; }
  button.primary:hover:not(:disabled) { background: #15803d; }
  canvas { display: block; width: 100%; background: #14532d; touch-action: none; }
  #bottom {
    display: flex; gap: 8px; flex-wrap: wrap; background: #1e293b;
    border-radius: 0 0 10px 10px; padding: 8px;
  }
  .shop {
    flex: 1 1 110px; display: flex; flex-direction: column; align-items: center;
    padding: 6px 4px; border: 2px solid #475569; border-radius: 8px;
    background: #273449; cursor: pointer; min-width: 100px;
  }
  .shop .ic { font-size: 24px; }
  .shop .nm { font-size: 13px; font-weight: 700; }
  .shop .ds { font-size: 11px; color: #94a3b8; }
  .shop .ct { font-size: 13px; color: #facc15; font-weight: 700; }
  .shop.sel { border-color: #facc15; background: #3b3a1f; }
  .shop.poor { opacity: .45; }
  #info {
    flex: 2 1 260px; display: none; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; border: 2px solid #facc15; border-radius: 8px; background: #273449;
    font-size: 13px;
  }
  #info .t { font-weight: 700; font-size: 15px; }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  #overlay .box {
    background: #1e293b; padding: 28px 36px; border-radius: 14px; text-align: center;
    border: 2px solid #475569; max-width: 90vw;
  }
  #overlay h2 { font-size: 30px; margin-bottom: 10px; }
  #overlay p { margin-bottom: 16px; color: #cbd5e1; line-height: 1.6; }
  .help { font-size: 12px; color: #64748b; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<h1>🏰 디펜스 게임</h1>
<div id="wrap">
  <div id="hud">
    <span class="stat">❤️ <span id="lives">20</span></span>
    <span class="stat">💰 <span id="gold">0</span></span>
    <span class="stat">🌊 웨이브 <span id="wave">0</span></span>
    <span class="stat">⭐ <span id="score">0</span></span>
    <span class="spacer"></span>
    <button id="pauseBtn">⏸ 일시정지</button>
    <button id="speedBtn">▶ x1</button>
    <button id="waveBtn" class="primary">다음 웨이브 ▶</button>
  </div>
  <canvas id="c" width="960" height="576"></canvas>
  <div id="bottom">
    <div id="shopList" style="display:contents"></div>
    <div id="info"></div>
  </div>
  <div class="help">타워를 고르고 풀밭을 클릭해 설치 · 설치된 타워를 클릭하면 업그레이드/판매 · 우클릭/ESC 취소 · 단축키 1~4, Space(웨이브)</div>
</div>

<div id="overlay"><div class="box">
  <h2 id="ovTitle"></h2>
  <p id="ovText"></p>
  <button class="primary" id="ovBtn"></button>
</div></div>

<script>
// ===== 기본 설정 =====
const COLS = 20, ROWS = 12, T = 48;
const W = COLS * T, H = ROWS * T;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// 적이 지나가는 길 (타일 좌표)
const WAYPOINTS = [[-1, 2], [4, 2], [4, 8], [9, 8], [9, 3], [15, 3], [15, 9], [20, 9]];
const pathPts = WAYPOINTS.map(([c, r]) => ({ x: c * T + T / 2, y: r * T + T / 2 }));
const pathTiles = new Set();
for (let i = 0; i < WAYPOINTS.length - 1; i++) {
  let [c1, r1] = WAYPOINTS[i], [c2, r2] = WAYPOINTS[i + 1];
  const dc = Math.sign(c2 - c1), dr = Math.sign(r2 - r1);
  while (c1 !== c2 || r1 !== r2) { pathTiles.add(c1 + ',' + r1); c1 += dc; r1 += dr; }
  pathTiles.add(c2 + ',' + r2);
}

// ===== 타워 정의 =====
const TOWERS = {
  arrow: {
    name: '화살탑', icon: '🏹', cost: 50, color: '#4ade80', desc: '빠른 연사',
    levels: [
      { dmg: 9, range: 120, rate: 0.45 },
      { dmg: 16, range: 135, rate: 0.36 },
      { dmg: 28, range: 150, rate: 0.28 },
    ],
  },
  cannon: {
    name: '대포탑', icon: '💣', cost: 100, color: '#f97316', desc: '범위 공격',
    levels: [
      { dmg: 28, range: 110, rate: 1.3, splash: 55 },
      { dmg: 50, range: 120, rate: 1.15, splash: 65 },
      { dmg: 90, range: 135, rate: 1.0, splash: 80 },
    ],
  },
  frost: {
    name: '얼음탑', icon: '❄️', cost: 80, color: '#38bdf8', desc: '적 감속',
    levels: [
      { dmg: 5, range: 110, rate: 0.8, slow: 0.5, slowDur: 1.5 },
      { dmg: 9, range: 125, rate: 0.7, slow: 0.4, slowDur: 2.0 },
      { dmg: 15, range: 140, rate: 0.6, slow: 0.3, slowDur: 2.5 },
    ],
  },
  laser: {
    name: '레이저탑', icon: '⚡', cost: 150, color: '#c084fc', desc: '장거리 강타',
    levels: [
      { dmg: 70, range: 190, rate: 1.8 },
      { dmg: 130, range: 215, rate: 1.6 },
      { dmg: 240, range: 240, rate: 1.4 },
    ],
  },
};
const TOWER_KEYS = Object.keys(TOWERS);
const upgradeCost = (t) => Math.round(TOWERS[t.type].cost * 0.9 * (t.level + 1));
const sellValue = (t) => Math.round(t.spent * 0.7);

// ===== 적 정의 =====
const ENEMIES = {
  normal: { hp: 32, speed: 62, reward: 5, color: '#ef4444', r: 12 },
  fast:   { hp: 20, speed: 115, reward: 6, color: '#facc15', r: 10 },
  tank:   { hp: 140, speed: 38, reward: 14, color: '#64748b', r: 16 },
  boss:   { hp: 900, speed: 32, reward: 100, color: '#a21caf', r: 22 },
};

// ===== 게임 상태 =====
let S;
function resetGame() {
  S = {
    gold: 180, lives: 20, wave: 0, score: 0,
    towers: [], enemies: [], bullets: [], particles: [], texts: [], beams: [],
    spawnQueue: [], spawnTimer: 0, waveActive: false,
    selectedType: null, selectedTower: null, hover: null,
    speed: 1, paused: false, over: false, time: 0,
  };
  updateHUD(); renderShop(); renderInfo();
}

function buildWave(n) {
  const q = [];
  const count = 6 + n * 2;
  for (let i = 0; i < count; i++) {
    let type = 'normal';
    const r = Math.random();
    if (n >= 3 && r < 0.3) type = 'fast';
    if (n >= 5 && r > 0.8) type = 'tank';
    if (n >= 9 && r > 0.6 && r <= 0.8) type = 'tank';
    q.push(type);
  }
  if (n % 5 === 0) q.push('boss');
  if (n % 10 === 0) q.push('boss');
  return q;
}

function startWave() {
  if (S.waveActive || S.over) return;
  S.wave++;
  S.spawnQueue = buildWave(S.wave);
  S.spawnTimer = 0;
  S.waveActive = true;
  addText(W / 2, H / 2, `웨이브 ${S.wave}!`, '#fde047', 28, 1.5);
  updateHUD();
}

function spawnEnemy(type) {
  const d = ENEMIES[type];
  const scale = Math.pow(1.17, S.wave - 1);
  const hp = Math.round(d.hp * scale);
  S.enemies.push({
    type, x: pathPts[0].x, y: pathPts[0].y, seg: 0, dist: 0,
    hp, maxHp: hp, speed: d.speed * (1 + Math.min(S.wave, 30) * 0.01),
    reward: Math.round(d.reward * (1 + S.wave * 0.04)), r: d.r, color: d.color,
    slowMul: 1, slowTime: 0, hitFlash: 0,
  });
}

// ===== 업데이트 =====
function update(dt) {
  S.time += dt;
  // 스폰
  if (S.spawnQueue.length) {
    S.spawnTimer -= dt;
    if (S.spawnTimer <= 0) {
      const type = S.spawnQueue.shift();
      spawnEnemy(type);
      S.spawnTimer = type === 'boss' ? 1.5 : Math.max(0.35, 0.85 - S.wave * 0.02);
    }
  }

  // 적 이동
  for (const e of S.enemies) {
    if (e.slowTime > 0) { e.slowTime -= dt; if (e.slowTime <= 0) e.slowMul = 1; }
    if (e.hitFlash > 0) e.hitFlash -= dt;
    let move = e.speed * e.slowMul * dt;
    while (move > 0 && e.seg < pathPts.length - 1) {
      const tgt = pathPts[e.seg + 1];
      const dx = tgt.x - e.x, dy = tgt.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d <= move) { e.x = tgt.x; e.y = tgt.y; e.seg++; move -= d; e.dist += d; }
      else { e.x += dx / d * move; e.y += dy / d * move; e.dist += move; move = 0; }
    }
    if (e.seg >= pathPts.length - 1) {
      e.dead = true; e.leaked = true;
      S.lives -= e.type === 'boss' ? 5 : 1;
      burst(W - 10, e.y, '#ef4444', 12);
    }
  }

  // 타워 공격
  for (const t of S.towers) {
    const st = TOWERS[t.type].levels[t.level];
    t.cd -= dt;
    const target = findTarget(t, st.range);
    if (target) t.angle = Math.atan2(target.y - t.y, target.x - t.x);
    if (t.cd <= 0 && target) {
      t.cd = st.rate;
      if (t.type === 'laser') {
        damage(target, st.dmg);
        S.beams.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 0.15, color: TOWERS.laser.color, w: 3 + t.level * 2 });
      } else {
        S.bullets.push({
          type: t.type, x: t.x + Math.cos(t.angle) * 18, y: t.y + Math.sin(t.angle) * 18,
          target, speed: t.type === 'cannon' ? 320 : 480, st, level: t.level,
        });
      }
    }
  }

  // 투사체
  for (const b of S.bullets) {
    if (b.target.dead) {
      // 목표가 사라지면 마지막 위치로 계속 이동
      if (!b.tx) { b.tx = b.target.x; b.ty = b.target.y; }
    }
    const tx = b.target.dead ? b.tx : b.target.x;
    const ty = b.target.dead ? b.ty : b.target.y;
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    const step = b.speed * dt;
    if (d <= step + 4) {
      b.done = true;
      hitBullet(b, tx, ty);
    } else { b.x += dx / d * step; b.y += dy / d * step; }
  }

  // 정리
  for (const e of S.enemies) {
    if (e.dead && !e.leaked && !e.rewarded) {
      e.rewarded = true;
      S.gold += e.reward; S.score += e.reward * 10;
      addText(e.x, e.y - 10, `+${e.reward}`, '#facc15', 14, 0.8);
      burst(e.x, e.y, e.color, e.type === 'boss' ? 30 : 10);
    }
  }
  S.enemies = S.enemies.filter(e => !e.dead);
  S.bullets = S.bullets.filter(b => !b.done);

  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const t of S.texts) { t.y -= 25 * dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const b of S.beams) b.life -= dt;
  S.beams = S.beams.filter(b => b.life > 0);

  // 웨이브 종료
  if (S.waveActive && !S.spawnQueue.length && !S.enemies.length) {
    S.waveActive = false;
    const bonus = 20 + S.wave * 5;
    S.gold += bonus;
    addText(W / 2, H / 2, `웨이브 클리어! +${bonus}💰`, '#4ade80', 24, 1.6);
  }

  if (S.lives <= 0 && !S.over) {
    S.lives = 0; S.over = true;
    gameOver();
  }
  updateHUD();
}

function findTarget(t, range) {
  // 가장 앞서 있는 적을 조준
  let best = null;
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (Math.hypot(e.x - t.x, e.y - t.y) <= range && (!best || e.dist > best.dist)) best = e;
  }
  return best;
}

function damage(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.hitFlash = 0.08;
  if (e.hp <= 0) e.dead = true;
}

function hitBullet(b, x, y) {
  const st = b.st;
  if (b.type === 'cannon') {
    for (const e of S.enemies) {
      if (Math.hypot(e.x - x, e.y - y) <= st.splash) damage(e, st.dmg);
    }
    burst(x, y, '#fb923c', 14);
    S.particles.push({ x, y, vx: 0, vy: 0, life: 0.25, max: 0.25, ring: st.splash, color: '#fdba74' });
  } else if (b.type === 'frost') {
    if (!b.target.dead) {
      damage(b.target, st.dmg);
      b.target.slowMul = Math.min(b.target.slowMul, st.slow);
      b.target.slowTime = st.slowDur;
    }
    burst(x, y, '#7dd3fc', 5);
  } else {
    if (!b.target.dead) damage(b.target, st.dmg);
  }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
    S.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.3, max: 0.7, color, size: 2 + Math.random() * 3 });
  }
}
function addText(x, y, text, color, size, life) { S.texts.push({ x, y, text, color, size, life, max: life }); }

// ===== 그리기 =====
function draw() {
  // 풀밭
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#166534' : '#15803d';
    ctx.fillRect(c * T, r * T, T, T);
  }
  // 길
  for (const k of pathTiles) {
    const [c, r] = k.split(',').map(Number);
    if (c < 0 || c >= COLS) continue;
    ctx.fillStyle = '#a16207'; ctx.fillRect(c * T, r * T, T, T);
    ctx.fillStyle = '#ca8a04'; ctx.fillRect(c * T + 3, r * T + 3, T - 6, T - 6);
  }
  // 출발/도착
  ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🕳️', pathPts[1].x - T * 4, pathPts[0].y);
  ctx.fillText('🏰', W - T / 2, pathPts[pathPts.length - 1].y);

  // 설치 미리보기
  if (S.selectedType && S.hover) {
    const { c, r } = S.hover;
    const ok = canBuild(c, r);
    const x = c * T + T / 2, y = r * T + T / 2;
    const st = TOWERS[S.selectedType].levels[0];
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.12)' : 'rgba(239,68,68,0.15)';
    ctx.strokeStyle = ok ? 'rgba(255,255,255,0.5)' : 'rgba(239,68,68,0.6)';
    ctx.beginPath(); ctx.arc(x, y, st.range, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.3)' : 'rgba(239,68,68,0.5)';
    ctx.fillRect(c * T, r * T, T, T);
  }
  // 선택된 타워 범위
  if (S.selectedTower) {
    const t = S.selectedTower, st = TOWERS[t.type].levels[t.level];
    ctx.fillStyle = 'rgba(250,204,21,0.1)'; ctx.strokeStyle = 'rgba(250,204,21,0.7)';
    ctx.beginPath(); ctx.arc(t.x, t.y, st.range, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // 타워
  for (const t of S.towers) drawTower(t);

  // 적
  for (const e of S.enemies) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.8, e.r, e.r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.stroke();
    if (e.slowMul < 1) {
      ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    // 눈
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(e.x - e.r * 0.35, e.y - e.r * 0.2, e.r * 0.25, 0, 7); ctx.arc(e.x + e.r * 0.35, e.y - e.r * 0.2, e.r * 0.25, 0, 7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(e.x - e.r * 0.3, e.y - e.r * 0.2, e.r * 0.11, 0, 7); ctx.arc(e.x + e.r * 0.4, e.y - e.r * 0.2, e.r * 0.11, 0, 7); ctx.fill();
    if (e.type === 'boss') { ctx.font = '18px serif'; ctx.fillText('👑', e.x, e.y - e.r - 12); }
    // 체력바
    const bw = e.r * 2.2, pct = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = '#111'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 8, bw, 4);
    ctx.fillStyle = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#eab308' : '#ef4444';
    ctx.fillRect(e.x - bw / 2, e.y - e.r - 8, bw * pct, 4);
    ctx.restore();
  }

  // 투사체
  for (const b of S.bullets) {
    if (b.type === 'cannon') { ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill(); }
    else if (b.type === 'frost') { ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill(); }
  }
  // 레이저
  for (const b of S.beams) {
    ctx.globalAlpha = b.life / 0.15;
    ctx.strokeStyle = b.color; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = b.w / 3; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 파티클
  for (const p of S.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.ring * (1 - p.life / p.max), 0, 7); ctx.stroke();
    } else { ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
  // 떠오르는 글자
  for (const t of S.texts) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
    ctx.font = `bold ${t.size}px "Malgun Gothic", sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  if (S.paused && !S.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 40px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText('일시정지', W / 2, H / 2);
  }
}

function drawTower(t) {
  const def = TOWERS[t.type];
  const x = t.x, y = t.y;
  ctx.fillStyle = '#334155'; ctx.fillRect(x - 20, y - 20, 40, 40);
  ctx.fillStyle = '#475569'; ctx.fillRect(x - 17, y - 17, 34, 34);
  ctx.fillStyle = def.color;
  ctx.beginPath(); ctx.arc(x, y, 12 + t.level * 1.5, 0, 7); ctx.fill();
  // 포신
  ctx.save(); ctx.translate(x, y); ctx.rotate(t.angle);
  ctx.fillStyle = '#1e293b';
  const len = t.type === 'laser' ? 22 : t.type === 'cannon' ? 18 : 20;
  const wid = t.type === 'cannon' ? 10 : 5;
  ctx.fillRect(0, -wid / 2, len, wid);
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
  // 레벨 표시
  for (let i = 0; i <= t.level; i++) {
    ctx.fillStyle = '#facc15';
    ctx.beginPath(); ctx.arc(x - 12 + i * 12, y + 17, 3, 0, 7); ctx.fill();
  }
}

// ===== 입력 =====
function canBuild(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
  if (pathTiles.has(c + ',' + r)) return false;
  return !S.towers.some(t => t.c === c && t.r === r);
}
function tileFromEvent(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (W / rect.width);
  const y = (ev.clientY - rect.top) * (H / rect.height);
  return { c: Math.floor(x / T), r: Math.floor(y / T) };
}
canvas.addEventListener('pointermove', ev => { S.hover = tileFromEvent(ev); });
canvas.addEventListener('pointerleave', () => { S.hover = null; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); cancelSelection(); });
canvas.addEventListener('pointerdown', ev => {
  if (ev.button === 2 || S.over) return;
  const { c, r } = tileFromEvent(ev);
  S.hover = { c, r };
  const existing = S.towers.find(t => t.c === c && t.r === r);
  if (existing) {
    S.selectedTower = existing; S.selectedType = null;
  } else if (S.selectedType) {
    const def = TOWERS[S.selectedType];
    if (canBuild(c, r) && S.gold >= def.cost) {
      S.gold -= def.cost;
      S.towers.push({ type: S.selectedType, c, r, x: c * T + T / 2, y: r * T + T / 2, level: 0, cd: 0, angle: -Math.PI / 2, spent: def.cost });
      burst(c * T + T / 2, r * T + T / 2, def.color, 10);
      if (S.gold < def.cost) S.selectedType = null;
    } else if (S.gold < def.cost) {
      addText(c * T + T / 2, r * T, '골드 부족!', '#f87171', 16, 0.8);
    }
  } else {
    S.selectedTower = null;
  }
  renderShop(); renderInfo(); updateHUD();
});
function cancelSelection() { S.selectedType = null; S.selectedTower = null; renderShop(); renderInfo(); }

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') cancelSelection();
  else if (ev.key >= '1' && ev.key <= '4') selectType(TOWER_KEYS[+ev.key - 1]);
  else if (ev.key === ' ') { ev.preventDefault(); startWave(); }
  else if (ev.key === 'p' || ev.key === 'P') togglePause();
  else if ((ev.key === 'u' || ev.key === 'U') && S.selectedTower) upgradeTower();
});

function selectType(type) {
  if (S.over) return;
  S.selectedType = S.selectedType === type ? null : type;
  S.selectedTower = null;
  renderShop(); renderInfo();
}

function upgradeTower() {
  const t = S.selectedTower;
  if (!t || t.level >= 2) return;
  const cost = upgradeCost(t);
  if (S.gold < cost) return;
  S.gold -= cost; t.spent += cost; t.level++;
  burst(t.x, t.y, '#facc15', 16);
  renderInfo(); updateHUD();
}
function sellTower() {
  const t = S.selectedTower;
  if (!t) return;
  const v = sellValue(t);
  S.gold += v;
  addText(t.x, t.y, `+${v}`, '#facc15', 14, 0.8);
  S.towers = S.towers.filter(x => x !== t);
  S.selectedTower = null;
  renderInfo(); updateHUD();
}

// ===== UI =====
const $ = id => document.getElementById(id);
function renderShop() {
  $('shopList').innerHTML = TOWER_KEYS.map((k, i) => {
    const d = TOWERS[k];
    const cls = ['shop', S && S.selectedType === k ? 'sel' : '', S && S.gold < d.cost ? 'poor' : ''].join(' ');
    return `<div class="${cls}" data-k="${k}"><span class="ic">${d.icon}</span><span class="nm">${i + 1}. ${d.name}</span><span class="ds">${d.desc}</span><span class="ct">💰 ${d.cost}</span></div>`;
  }).join('');
  document.querySelectorAll('.shop').forEach(el => el.onclick = () => selectType(el.dataset.k));
}
function renderInfo() {
  const box = $('info');
  const t = S && S.selectedTower;
  if (!t) { box.style.display = 'none'; return; }
  const def = TOWERS[t.type], st = def.levels[t.level];
  const next = def.levels[t.level + 1];
  let extra = '';
  if (st.splash) extra += ` · 범위 ${st.splash}`;
  if (st.slow) extra += ` · 감속 ${Math.round((1 - st.slow) * 100)}%`;
  const up = t.level < 2
    ? `<button id="upBtn" ${S.gold < upgradeCost(t) ? 'disabled' : ''}>⬆ 업그레이드 💰${upgradeCost(t)} (공격 ${st.dmg}→${next.dmg})</button>`
    : '<span style="color:#facc15">★ 최대 레벨</span>';
  box.innerHTML = `<span class="t">${def.icon} ${def.name} Lv.${t.level + 1}</span>
    <span>공격 ${st.dmg} · 사거리 ${st.range} · 속도 ${(1 / st.rate).toFixed(1)}/초${extra}</span>
    ${up}<button id="sellBtn">판매 +💰${sellValue(t)}</button>`;
  box.style.display = 'flex';
  if ($('upBtn')) $('upBtn').onclick = upgradeTower;
  $('sellBtn').onclick = sellTower;
}
let lastHud = '';
function updateHUD() {
  $('lives').textContent = S.lives;
  $('gold').textContent = S.gold;
  $('wave').textContent = S.wave;
  $('score').textContent = S.score;
  $('waveBtn').disabled = S.waveActive || S.over;
  $('waveBtn').textContent = S.waveActive ? `웨이브 진행 중...` : '다음 웨이브 ▶';
  // 골드 변화 시 상점/정보 갱신
  const key = S.gold + '|' + (S.selectedTower ? S.selectedTower.level : '');
  if (key !== lastHud) {
    lastHud = key;
    document.querySelectorAll('.shop').forEach(el => el.classList.toggle('poor', S.gold < TOWERS[el.dataset.k].cost));
    const up = $('upBtn');
    if (up && S.selectedTower) up.disabled = S.gold < upgradeCost(S.selectedTower);
  }
}
function togglePause() {
  if (S.over) return;
  S.paused = !S.paused;
  $('pauseBtn').textContent = S.paused ? '▶ 계속' : '⏸ 일시정지';
}
$('pauseBtn').onclick = togglePause;
$('speedBtn').onclick = () => {
  S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  $('speedBtn').textContent = `▶ x${S.speed}`;
};
$('waveBtn').onclick = startWave;

function getBest() { try { return +localStorage.getItem('defence-best') || 0; } catch { return 0; } }
function setBest(v) { try { localStorage.setItem('defence-best', v); } catch {} }

function showOverlay(title, text, btn, onClick) {
  $('ovTitle').textContent = title; $('ovText').innerHTML = text; $('ovBtn').textContent = btn;
  $('ovBtn').onclick = () => { $('overlay').style.display = 'none'; onClick(); };
  $('overlay').style.display = 'flex';
}
function gameOver() {
  const best = Math.max(getBest(), S.score); setBest(best);
  showOverlay('💀 게임 오버', `웨이브 <b>${S.wave}</b>까지 버텼어요!<br>점수: <b>${S.score}</b> · 최고 점수: <b>${best}</b>`, '다시 하기', () => {
    resetGame(); $('speedBtn').textContent = '▶ x1'; $('pauseBtn').textContent = '⏸ 일시정지';
  });
}

// ===== 루프 =====
let last = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!S.paused && !S.over) {
    for (let i = 0; i < S.speed; i++) update(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

resetGame();
showOverlay('🏰 디펜스 게임',
  `몰려오는 적들이 성에 닿지 않도록 타워를 세워 막아내세요!<br>
   🏹 화살탑 · 💣 대포탑 · ❄️ 얼음탑 · ⚡ 레이저탑<br>
   5웨이브마다 👑 보스가 등장합니다.<br>최고 점수: <b>${getBest()}</b>`,
  '게임 시작', () => {});
requestAnimationFrame(loop);
</script>
</body>
