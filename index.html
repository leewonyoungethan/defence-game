<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>디펜스 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #1e1b4b 0%, #312e81 60%, #4c1d95 100%);
    color: #f8fafc; min-height: 100vh;
    font-family: "Jua", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px; user-select: none;
  }
  h1 {
    font-size: 32px; margin-bottom: 8px; letter-spacing: 2px; font-weight: 400;
    color: #fff; text-shadow: 3px 3px 0 #db2777, -1px -1px 0 #1e1b4b, 0 0 18px rgba(244,114,182,.6);
  }
  #wrap { width: 100%; max-width: 960px; }
  .panel { background: rgba(15,23,42,.75); border: 3px solid #fff; box-shadow: 0 4px 0 #1e1b4b; }
  #hud {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    border-radius: 16px 16px 0 0; padding: 8px 12px; border-bottom: none;
  }
  .stat {
    font-size: 18px; margin-right: 6px; background: #fff; color: #1e1b4b;

  }
  .spacer { flex: 1; }

    background: #fff; color: #1e1b4b; border: 3px solid #1e1b4b; border-radius: 12px;
    padding: 5px 12px; font-size: 16px; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 0 #1e1b4b; transition: transform .08s, box-shadow .08s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 #1e1b4b; }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #1e1b4b; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #4ade80; color: #14532d; }
  button.primary { background: #f472b6; color: #fff; text-shadow: 1px 1px 0 #9d174d; }
  canvas { display: block; width: 100%; touch-action: none; border-left: 3px solid #fff; border-right: 3px solid #fff; }
  #bottom { border-radius: 0 0 16px 16px; padding: 8px; border-top: none; }
  #shopList { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
  .shop {
    display: flex; flex-direction: column; align-items: center; padding: 4px 2px;
    border: 3px solid #475569; border-radius: 12px; background: #1e293b; cursor: pointer;
    transition: transform .1s; position: relative;
  }
  .shop:hover { transform: translateY(-3px) rotate(-2deg); }
  .shop .ic { font-size: 24px; line-height: 1.2; }
  .shop .nm { font-size: 14px; }
  .shop .ct { font-size: 13px; color: #fde047; }
  .shop .hk { position: absolute; top: 1px; left: 5px; font-size: 11px; color: #94a3b8; }
  .shop.sel { border-color: #fde047; background: #713f12; transform: translateY(-3px) scale(1.05); box-shadow: 0 0 14px #fde047; }
  .shop.poor { opacity: .4; }
  #info {
    display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    padding: 8px 12px; border: 3px solid #fde047; border-radius: 12px; background: #1e293b; font-size: 15px;
  }
  #info .t { font-size: 19px; color: #fde047; }
  #info .d { color: #cbd5e1; }
  #desc { margin-top: 6px; font-size: 14px; color: #c7d2fe; min-height: 20px; text-align: center; }
  #overlay {
    position: fixed; inset: 0; background: rgba(30,27,75,.75); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  #overlay .box {
    background: #fff; color: #1e1b4b; padding: 26px 30px; border-radius: 24px; text-align: center;
    border: 4px solid #1e1b4b; box-shadow: 0 8px 0 #1e1b4b; max-width: 520px;
    animation: pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  #overlay h2 { font-size: 36px; margin-bottom: 10px; font-weight: 400; color: #db2777; }
  #overlay p { margin-bottom: 18px; line-height: 1.7; font-size: 16px; }
  .help { font-size: 13px; color: #a5b4fc; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<h1>🏰 디펜스 게임 ✨</h1>
<div id="wrap">
  <div id="hud" class="panel">
    <span class="stat">❤️ <span id="lives">20</span></span>
    <span class="stat">💰 <span id="gold">0</span></span>

    <span class="spacer"></span>
    <button id="codeBtn">🔑 코드</button>
    <button id="pauseBtn">⏸</button>
    <button id="speedBtn">x1</button>
    <button id="autoBtn">🔁 연속 OFF</button>

    <div id="shopList"></div>

</div>

<div id="overlay"><div class="box">
  <h2 id="ovTitle"></h2>
  <p id="ovText"></p>
  <button class="primary" id="ovBtn"></button>

<script>
// ================= 기본 설정 =================
const COLS = 20, ROWS = 12, T = 48;
const W = COLS * T, H = ROWS * T;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const OUT = '#1e1b4b';            // 애니풍 외곽선 색
const FONT = '"Jua", "Malgun Gothic", sans-serif';
const EMOJI = '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';

// 적이 지나가는 길 (타일 좌표)
const WAYPOINTS = [[-1, 2], [4, 2], [4, 8], [9, 8], [9, 3], [15, 3], [15, 9], [20, 9]];
const pathPts = WAYPOINTS.map(([c, r]) => ({ x: c * T + T / 2, y: r * T + T / 2 }));
const segLen = [];
for (let i = 0; i < pathPts.length - 1; i++) segLen.push(Math.hypot(pathPts[i + 1].x - pathPts[i].x, pathPts[i + 1].y - pathPts[i].y));
const totalLen = segLen.reduce((a, b) => a + b, 0);
const pathTiles = new Set();
for (let i = 0; i < WAYPOINTS.length - 1; i++) {
  let [c1, r1] = WAYPOINTS[i], [c2, r2] = WAYPOINTS[i + 1];
  const dc = Math.sign(c2 - c1), dr = Math.sign(r2 - r1);
  while (c1 !== c2 || r1 !== r2) { pathTiles.add(c1 + ',' + r1); c1 += dc; r1 += dr; }
  pathTiles.add(c2 + ',' + r2);
}
function posAt(d) {
  let i = 0;
  while (i < segLen.length - 1 && d > segLen[i]) { d -= segLen[i]; i++; }
  d = Math.max(0, Math.min(d, segLen[i]));
  const a = pathPts[i], b = pathPts[i + 1], k = d / segLen[i];
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, dx: Math.sign(b.x - a.x), dy: Math.sign(b.y - a.y) };
}

// ================= 타워 20종 =================
// kind: proj(투사체) pierce(관통) beam(즉발) chain(연쇄) aura(주변 전체) mine(골드) buff(강화)
// 배열 값은 [1레벨, 2레벨, 3레벨]
const TOWER_LIST = [
  { id: 'arrow', name: '화살탑', icon: '🏹', cost: 50, color: '#4ade80', desc: '빠르게 화살을 쏘는 기본 타워', kind: 'proj', bullet: 'arrow',
    s: { dmg: [9, 16, 28], range: [120, 135, 150], rate: [.45, .36, .28], speed: 540 } },
  { id: 'cannon', name: '대포탑', icon: '💣', cost: 100, color: '#fb923c', desc: '폭발로 주변 적까지 피해', kind: 'proj', bullet: 'ball',
    s: { dmg: [28, 50, 90], range: [110, 120, 135], rate: [1.3, 1.15, 1], splash: [55, 65, 80], speed: 330 } },
  { id: 'frost', name: '얼음탑', icon: '❄️', cost: 80, color: '#38bdf8', desc: '맞은 적을 느리게 만듦', kind: 'proj', bullet: 'ice',
    s: { dmg: [5, 9, 15], range: [110, 125, 140], rate: [.8, .7, .6], slow: [.5, .4, .3], slowDur: [1.5, 2, 2.5], speed: 460 } },
  { id: 'laser', name: '레이저탑', icon: '⚡', cost: 150, color: '#c084fc', desc: '긴 사거리의 강력한 광선', kind: 'beam',
    s: { dmg: [70, 130, 240], range: [190, 215, 240], rate: [1.8, 1.6, 1.4] } },
  { id: 'poison', name: '독탑', icon: '🧪', cost: 90, color: '#a3e635', desc: '독으로 계속 피해를 줌', kind: 'proj', bullet: 'poison',
    s: { dmg: [4, 7, 12], range: [120, 130, 145], rate: [.9, .8, .7], poison: [12, 25, 50], poisonDur: 3.5, speed: 420 } },
  { id: 'lightning', name: '번개탑', icon: '🌩️', cost: 130, color: '#fde047', desc: '여러 적에게 튀는 연쇄 번개', kind: 'chain',
    s: { dmg: [22, 38, 65], range: [130, 140, 155], rate: [1.1, 1, .9], chain: [3, 4, 6], chainRange: [90, 100, 115] } },
  { id: 'fire', name: '화염탑', icon: '🔥', cost: 110, color: '#ef4444', desc: '주변의 모든 적을 불태움', kind: 'aura', fx: 'flame',
    s: { dmg: [6, 11, 20], range: [75, 85, 95], rate: [.2, .18, .15] } },
  { id: 'mine', name: '금광', icon: '⛏️', cost: 120, color: '#eab308', desc: '웨이브를 깰 때마다 골드 획득', kind: 'mine',
    s: { income: [30, 55, 90], range: 0 } },
  { id: 'sniper', name: '저격탑', icon: '🎯', cost: 200, color: '#94a3b8', desc: '체력이 가장 많은 적을 초장거리 저격', kind: 'beam', target: 'strong',
    s: { dmg: [150, 300, 600], range: [320, 380, 450], rate: [3, 2.7, 2.4] } },
  { id: 'gatling', name: '기관총탑', icon: '🔫', cost: 120, color: '#64748b', desc: '엄청 빠른 연사', kind: 'proj', bullet: 'bullet',
    s: { dmg: [4, 7, 12], range: [110, 120, 130], rate: [.12, .1, .08], speed: 700 } },
  { id: 'missile', name: '미사일탑', icon: '🚀', cost: 220, color: '#f43f5e', desc: '유도 미사일 대폭발', kind: 'proj', bullet: 'missile', shake: 4,
    s: { dmg: [60, 110, 200], range: [200, 220, 250], rate: [2.2, 2, 1.8], splash: [70, 80, 95], speed: 280 } },
  { id: 'nova', name: '눈보라탑', icon: '🌨️', cost: 140, color: '#7dd3fc', desc: '주변 전체를 얼리는 냉기 파동', kind: 'aura', fx: 'ring',
    s: { dmg: [10, 18, 30], range: [90, 100, 115], rate: [2, 1.8, 1.6], slow: [.5, .4, .3], slowDur: 2 } },
  { id: 'multi', name: '산탄탑', icon: '🎇', cost: 130, color: '#f0abfc', desc: '여러 적을 동시에 공격', kind: 'proj', bullet: 'star',
    s: { dmg: [10, 18, 30], range: [130, 140, 150], rate: [.7, .65, .6], multi: [3, 4, 5], speed: 480 } },
  { id: 'buff', name: '응원탑', icon: '📯', cost: 160, color: '#fbbf24', desc: '주변 타워의 공격력 증가', kind: 'buff',
    s: { buff: [.2, .35, .5], range: [100, 110, 125] } },
  { id: 'boomerang', name: '부메랑탑', icon: '🪃', cost: 120, color: '#d97706', desc: '일직선의 적을 모두 관통', kind: 'pierce',
    s: { dmg: [18, 32, 55], range: [150, 165, 180], rate: [1, .9, .8], speed: 420 } },
  { id: 'hammer', name: '망치탑', icon: '🔨', cost: 150, color: '#a8a29e', desc: '땅을 내리쳐 주변 적 기절', kind: 'aura', fx: 'slam', shake: 3,
    s: { dmg: [15, 28, 48], range: [70, 80, 90], rate: [2.5, 2.3, 2], stun: [.5, .8, 1.1] } },
  { id: 'gem', name: '보석탑', icon: '💎', cost: 110, color: '#f472b6', desc: '맞은 적 처치 시 골드 2배', kind: 'proj', bullet: 'gem',
    s: { dmg: [8, 14, 24], range: [130, 140, 150], rate: [.6, .55, .5], bounty: true, speed: 480 } },
  { id: 'tornado', name: '회오리탑', icon: '🌪️', cost: 170, color: '#99f6e4', desc: '적을 뒤로 날려버림', kind: 'proj', bullet: 'wind',
    s: { dmg: [10, 18, 30], range: [130, 140, 150], rate: [1.5, 1.4, 1.2], knock: [30, 45, 60], speed: 360 } },
  { id: 'blackhole', name: '블랙홀탑', icon: '🌀', cost: 250, color: '#7c3aed', desc: '주변 적을 끌어당겨 크게 감속', kind: 'aura', fx: 'vortex',
    s: { dmg: [3, 6, 10], range: [90, 100, 115], rate: [.2, .2, .2], slow: [.6, .5, .4], slowDur: .3 } },
  { id: 'dragon', name: '드래곤탑', icon: '🐉', cost: 500, color: '#dc2626', desc: '화염구 폭발 + 화상! 최강 타워', kind: 'proj', bullet: 'fireball', shake: 5,
    s: { dmg: [80, 150, 280], range: [170, 190, 210], rate: [1.5, 1.35, 1.2], splash: [60, 70, 85], poison: [20, 40, 80], poisonDur: 3, speed: 380 } },
];
TOWER_LIST.forEach(d => {
  d.levels = [0, 1, 2].map(i => Object.fromEntries(Object.entries(d.s).map(([k, v]) => [k, Array.isArray(v) ? v[i] : v])));
  d.light = mix(d.color, '#ffffff', 0.55);
  d.dark = mix(d.color, '#000000', 0.35);
  d.barrel = ['proj', 'pierce', 'beam'].includes(d.kind);
});
const TOWERS = Object.fromEntries(TOWER_LIST.map(d => [d.id, d]));
const upgradeCost = (t) => Math.round(TOWERS[t.type].cost * 0.9 * (t.level + 1));
const sellValue = (t) => Math.round(t.spent * 0.7);

// ================= 적 =================
const ENEMIES = {
  normal: { hp: 32, speed: 62, reward: 5, color: '#fb7185', r: 13 },
  fast:   { hp: 20, speed: 115, reward: 6, color: '#fde047', r: 11 },
  tank:   { hp: 140, speed: 38, reward: 14, color: '#60a5fa', r: 17 },
  boss:   { hp: 900, speed: 32, reward: 100, color: '#c084fc', r: 24 },
  bat:      { hp: 26, speed: 90, reward: 7, color: '#818cf8', r: 11, flying: true, name: '박쥐', icon: '🦇', info: '날아다님 · 주변 공격 타워에 안 맞음', from: 6 },
  healer:   { hp: 45, speed: 55, reward: 10, color: '#86efac', r: 13, heal: true, name: '힐러', icon: '💚', info: '주변 적 체력 회복', from: 8 },
  splitter: { hp: 60, speed: 50, reward: 8, color: '#f9a8d4', r: 15, split: true, name: '분열', icon: '🫧', info: '죽으면 2마리로 분열', from: 12 },
  mini:     { hp: 20, speed: 80, reward: 3, color: '#f9a8d4', r: 8 },
  knight:   { hp: 110, speed: 45, reward: 14, color: '#fbbf24', r: 15, armor: 0.4, name: '기사', icon: '🛡️', info: '받는 피해 40% 감소', from: 15 },
  ghost:    { hp: 50, speed: 70, reward: 11, color: '#e0e7ff', r: 13, ghost: true, name: '유령', icon: '👻', info: '가끔 투명해져 공격 불가', from: 20 },
  troll:    { hp: 200, speed: 36, reward: 18, color: '#34d399', r: 17, regen: 0.04, name: '트롤', icon: '💪', info: '체력 자동 회복', from: 25 },
  dasher:   { hp: 40, speed: 60, reward: 9, color: '#fb923c', r: 12, dash: true, name: '돌진', icon: '💨', info: '가끔 초고속 돌진', from: 30 },
};
const SPECIALS = Object.entries(ENEMIES).filter(([, d]) => d.from).map(([k]) => k);

// ================= 유틸 =================
function mix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (p, s) => (p >> s) & 255;
  const m = s => Math.round(ch(pa, s) + (ch(pb, s) - ch(pa, s)) * k);
  return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1);
}
const easeOutBack = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function starPath(x, y, n, o, i, rot = 0) {
  ctx.beginPath();
  for (let k = 0; k < n * 2; k++) {
    const rad = k % 2 ? i : o, a = rot + k * Math.PI / n - Math.PI / 2;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= 배경 (미리 그려두기) =================
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
function buildBackground() {
  const b = bg.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#86efac'); g.addColorStop(1, '#4ade80');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if ((r + c) % 2) { b.fillStyle = 'rgba(255,255,255,0.07)'; b.fillRect(c * T, r * T, T, T); }
  }
  const rnd = seeded(7);
  // 풀잎
  b.strokeStyle = '#16a34a'; b.lineWidth = 2; b.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const x = rnd() * W, y = rnd() * H;
    b.beginPath(); b.moveTo(x - 3, y - 5); b.lineTo(x, y); b.lineTo(x + 3, y - 6); b.stroke();
  }
  // 꽃
  const fc = ['#fff', '#fbcfe8', '#fde68a', '#c4b5fd'];
  for (let i = 0; i < 70; i++) {
    const x = rnd() * W, y = rnd() * H;
    b.fillStyle = fc[i % 4];
    for (let k = 0; k < 5; k++) { const a = k * 1.256; b.beginPath(); b.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2.3, 0, 7); b.fill(); }
    b.fillStyle = '#f59e0b'; b.beginPath(); b.arc(x, y, 1.8, 0, 7); b.fill();
  }
  // 길
  b.lineJoin = 'round'; b.lineCap = 'butt';
  const stroke = (w, col) => { b.strokeStyle = col; b.lineWidth = w; b.beginPath(); pathPts.forEach((p, i) => i ? b.lineTo(p.x, p.y) : b.moveTo(p.x, p.y)); b.stroke(); };
  stroke(T + 10, OUT); stroke(T + 4, '#b45309'); stroke(T - 6, '#fcd34d'); stroke(T - 22, '#fde68a');
  // 자갈
  for (const k of pathTiles) {
    const [c, r] = k.split(',').map(Number);
    for (let i = 0; i < 3; i++) {
      b.fillStyle = rnd() < .5 ? '#f59e0b' : '#fbbf24';
      b.beginPath(); b.ellipse(c * T + 10 + rnd() * 28, r * T + 10 + rnd() * 28, 3, 2, rnd() * 3, 0, 7); b.fill();
    }
  }
}
buildBackground();

// ================= 게임 상태 =================
let S;
let infiniteGold = false; // 치트 코드 '방탄유리'
let enemyId = 0;
function resetGame() {
  S = {
    gold: 200, lives: 20, wave: 0, score: 0,
    towers: [], enemies: [], bullets: [], particles: [], texts: [], beams: [],
    spawnQueue: [], spawnTimer: 0, waveActive: false,
    selectedType: null, selectedTower: null, hover: null,
    speed: 1, paused: false, over: false, time: 0, shake: 0, banner: null,
    autoWave: false, autoTimer: 0,
  };
  lastHud = '';
  renderShop(); renderInfo(); updateHUD();
}

const MAX_WAVE = 100;
function buildWave(n) {
  const q = [];
  const count = Math.min(70, 6 + n * 2);
  for (let i = 0; i < count; i++) {
    let type = 'normal';
    const r = Math.random();
    if (n >= 3 && r < 0.3) type = 'fast';
    if (n >= 5 && r > 0.8) type = 'tank';
    if (n >= 9 && r > 0.6 && r <= 0.8) type = 'tank';
    if (n >= 40 && r >= 0.3 && r < 0.45) type = 'tank';
    // 특수 적: 등장 웨이브 이후 섞여 나옴
    const avail = SPECIALS.filter(k => n >= ENEMIES[k].from);
    if (avail.length && Math.random() < Math.min(0.5, 0.15 + avail.length * 0.05)) type = avail[Math.floor(Math.random() * avail.length)];
    q.push(type);
  }
  // 5웨이브마다 보스, 뒤로 갈수록 보스 수 증가, 100웨이브는 최종 보스전
  if (n % 5 === 0) for (let i = 0; i < 1 + Math.floor(n / 25); i++) q.push('boss');
  if (n === MAX_WAVE) for (let i = 0; i < 4; i++) q.push('boss');
  return q;
}
// 체력 배율: 초반엔 완만하게, 후반엔 가파르게 (100웨이브 ≈ 75배)
const hpScale = n => 1 + 0.15 * (n - 1) + 0.006 * (n - 1) * (n - 1);

function startWave() {
  if (S.waveActive || S.over || S.wave >= MAX_WAVE) return;
  S.wave++;
  S.autoTimer = 0;
  S.spawnQueue = buildWave(S.wave);
  S.spawnTimer = 0;
  S.waveActive = true;
  const newcomers = SPECIALS.filter(k => ENEMIES[k].from === S.wave);
  if (newcomers.length && S.wave !== MAX_WAVE) {
    const d = ENEMIES[newcomers[0]];
    for (let i = 0; i < 3; i++) S.spawnQueue.unshift(newcomers[0]);
    S.banner = { text: `NEW! ${d.name}`, sub: `${d.icon} ${d.info}`, age: 0, life: 2.6, color: '#38bdf8' };
  } else if (S.wave === MAX_WAVE) S.banner = { text: 'FINAL WAVE', sub: '👑 최종 보스 군단!', age: 0, life: 2.4, color: '#ef4444' };
  else S.banner = { text: `WAVE ${S.wave}`, sub: S.wave % 5 === 0 ? '👑 보스 출현!' : '적이 몰려온다!', age: 0, life: 2, color: S.wave % 5 === 0 ? '#c084fc' : '#f472b6' };
  updateHUD();
}

function spawnEnemy(type, dist = 0) {
  const d = ENEMIES[type];
  const hp = Math.round(d.hp * hpScale(S.wave));
  const p = posAt(dist);
  S.enemies.push({
    id: enemyId++, type, x: p.x, y: p.y, dx: 1, dy: 0, dist,
    flying: !!d.flying, armor: d.armor || 0, heal: d.heal, split: d.split, ghost: d.ghost, regen: d.regen || 0, dash: d.dash,
    abilityT: 1 + Math.random() * 2, hidden: false, dashT: 0,
    hp, maxHp: hp, speed: d.speed * (1 + Math.min(S.wave, 30) * 0.01),
    reward: Math.round(d.reward * (1 + S.wave * 0.04)), r: d.r, color: d.color,
    light: mix(d.color, '#ffffff', .6), dark: mix(d.color, '#000000', .3),
    slowMul: 1, slowTime: 0, stunTime: 0, poison: 0, poisonTime: 0, hitFlash: 0, marked: false,
  });
}

// ================= 업데이트 =================
function update(dt) {
  S.time += dt;
  S.shake = Math.max(0, S.shake - dt * 25);

  if (S.spawnQueue.length) {
    S.spawnTimer -= dt;
    if (S.spawnTimer <= 0) {
      const type = S.spawnQueue.shift();
      spawnEnemy(type);
      S.spawnTimer = type === 'boss' ? 1.5 : Math.max(0.35, 0.85 - S.wave * 0.02);
    }
  }

  // 적
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.slowTime > 0) { e.slowTime -= dt; if (e.slowTime <= 0) e.slowMul = 1; }
    if (e.stunTime > 0) e.stunTime -= dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.poisonTime > 0) {
      e.poisonTime -= dt;
      damage(e, e.poison * dt, true);
      if (Math.random() < dt * 6) S.particles.push({ kind: 'dot', x: e.x + (Math.random() - .5) * e.r, y: e.y, vx: 0, vy: -35, life: .6, max: .6, color: '#a3e635', size: 4, round: true });
      if (e.dead) continue;
    }
    // 특수 능력
    if (e.regen && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.regen * dt);
    if (e.heal || e.ghost || e.dash) {
      e.abilityT -= dt;
      if (e.dashT > 0) e.dashT -= dt;
      if (e.abilityT <= 0) {
        if (e.heal) {
          e.abilityT = 2.5;
          for (const o of S.enemies) {
            if (o.dead || o === e || Math.hypot(o.x - e.x, o.y - e.y) > 80) continue;
            o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.12);
            S.particles.push({ kind: 'dot', x: o.x, y: o.y - o.r, vx: 0, vy: -40, life: .6, max: .6, color: '#4ade80', size: 4, round: true });
          }
          S.particles.push({ kind: 'ring', x: e.x, y: e.y, life: .5, max: .5, radius: 80, color: '#86efac', lw: 4 });
        } else if (e.ghost) {
          e.hidden = !e.hidden;
          e.abilityT = e.hidden ? 1.4 : 2.6;
          for (let i = 0; i < 6; i++) S.particles.push({ kind: 'star', x: e.x + (Math.random() - .5) * 20, y: e.y + (Math.random() - .5) * 20, life: .4, max: .4, size: 4, color: '#e0e7ff' });
        } else if (e.dash) {
          e.dashT = 0.6; e.abilityT = 3 + Math.random();
          S.particles.push({ kind: 'ring', x: e.x, y: e.y, life: .3, max: .3, radius: 26, color: '#fed7aa', lw: 4 });
        }
      }
      if (e.dashT > 0 && Math.random() < .5) S.particles.push({ kind: 'dot', x: e.x - e.dx * e.r, y: e.y - e.dy * e.r, vx: -e.dx * 60, vy: -e.dy * 60, life: .3, max: .3, color: '#fdba74', size: 5, round: true });
    }
    const sp = e.stunTime > 0 ? 0 : e.speed * e.slowMul * (e.dashT > 0 ? 3.5 : 1);
    e.dist += sp * dt;
    const p = posAt(e.dist);
    e.x = p.x; e.y = p.y; e.dx = p.dx; e.dy = p.dy;
    if (e.dist >= totalLen) {
      e.dead = true; e.leaked = true;
      S.lives -= e.type === 'boss' ? 5 : 1;
      S.shake = Math.max(S.shake, 6);
      burst(e.x, e.y, '#ef4444', 14);
      addText(e.x - 20, e.y - 20, e.type === 'boss' ? '-5 ❤️' : '-1 ❤️', '#f87171', 20, 1);
    }
  }

  // 응원탑 버프 계산
  for (const t of S.towers) t.buffMul = 1;
  for (const b of S.towers) {
    if (b.type !== 'buff') continue;
    const st = TOWERS.buff.levels[b.level];
    for (const t of S.towers) {
      if (t !== b && Math.hypot(t.x - b.x, t.y - b.y) <= st.range) t.buffMul = Math.max(t.buffMul, 1 + st.buff);
    }
  }

  // 타워 공격
  for (const t of S.towers) {
    const def = TOWERS[t.type];
    t.kick = Math.max(0, t.kick - dt * 6);
    if (def.kind === 'mine' || def.kind === 'buff') continue;
    const st = def.levels[t.level];
    t.cd -= dt;
    const target = findTarget(t, st.range, def.target, def.kind === 'aura');
    if (target && def.kind !== 'aura') t.angle = Math.atan2(target.y - t.y, target.x - t.x);
    if (t.cd <= 0 && target) {
      t.cd = st.rate;
      t.kick = 1;
      fire(t, def, st, target);
    }
  }

  // 투사체
  for (const b of S.bullets) {
    if (b.pierce) {
      const step = b.speed * dt;
      b.x += b.vx * step; b.y += b.vy * step; b.traveled += step; b.spin += dt * 20;
      for (const e of S.enemies) {
        if (!e.dead && !e.hidden && !b.hit.has(e) && Math.hypot(e.x - b.x, e.y - b.y) <= e.r + 8) {
          b.hit.add(e); damage(e, b.dmg); impact(e.x, e.y, '#fde68a', 12);
        }
      }
      if (b.traveled > b.maxDist) b.done = true;
      continue;
    }
    if (b.target.dead && b.tx === undefined) { b.tx = b.target.x; b.ty = b.target.y; }
    const tx = b.target.dead ? b.tx : b.target.x;
    const ty = b.target.dead ? b.ty : b.target.y;
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    const step = b.speed * dt;
    b.angle = Math.atan2(dy, dx);
    if (b.bullet === 'fireball' || b.bullet === 'missile') {
      S.particles.push({ kind: 'dot', x: b.x, y: b.y, vx: (Math.random() - .5) * 20, vy: (Math.random() - .5) * 20, life: .35, max: .35, color: b.bullet === 'fireball' ? '#fb923c' : '#e5e7eb', size: 6, round: true });
    }
    if (d <= step + 4) { b.done = true; hitBullet(b, tx, ty); }
    else { b.x += dx / d * step; b.y += dy / d * step; }
  }

  // 처치 보상
  for (const e of S.enemies) {
    if (e.dead && !e.leaked && !e.rewarded) {
      e.rewarded = true;
      const rw = e.reward * (e.marked ? 2 : 1);
      S.gold += rw; S.score += rw * 10;
      addText(e.x, e.y - 14, `+${rw}${e.marked ? '💎' : ''}`, '#fde047', 17, .9);
      poof(e);
      if (e.split) for (const off of [-10, 10]) spawnEnemy('mini', Math.max(0, e.dist + off));
    }
  }
  S.enemies = S.enemies.filter(e => !e.dead);
  S.bullets = S.bullets.filter(b => !b.done);

  for (const p of S.particles) {
    p.life -= dt;
    if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; if (p.grav) p.vy += p.grav * dt; }
    if (p.pull) { p.x += (p.tx - p.x) * dt * 4; p.y += (p.ty - p.y) * dt * 4; }
  }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const t of S.texts) { t.age += dt; t.y -= 22 * dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const b of S.beams) b.life -= dt;
  S.beams = S.beams.filter(b => b.life > 0);
  if (S.banner) { S.banner.age += dt; if (S.banner.age > S.banner.life) S.banner = null; }

  // 웨이브 클리어
  if (S.waveActive && !S.spawnQueue.length && !S.enemies.length) {
    S.waveActive = false;
    const bonus = 20 + S.wave * 5;
    S.gold += bonus;
    for (const t of S.towers) {
      if (t.type !== 'mine') continue;
      const inc = TOWERS.mine.levels[t.level].income;
      S.gold += inc;
      addText(t.x, t.y - 26, `+${inc}💰`, '#fde047', 18, 1.5);
      for (let i = 0; i < 8; i++) S.particles.push({ kind: 'star', x: t.x, y: t.y - 10, vx: (Math.random() - .5) * 160, vy: -80 - Math.random() * 120, grav: 300, life: .9, max: .9, size: 6, color: '#fde047' });
    }
    S.banner = { text: 'CLEAR!', sub: `보너스 +${bonus}💰`, age: 0, life: 1.8, color: '#4ade80' };
    if (S.wave >= MAX_WAVE) { S.over = true; victory(); }
    else if (S.autoWave) S.autoTimer = 2;
  }

  // 연속 모드: 클리어 후 2초 뒤 자동 시작
  if (S.autoWave && !S.waveActive && S.autoTimer > 0) {
    S.autoTimer -= dt;
    if (S.autoTimer <= 0) startWave();
  }
  if (S.lives <= 0 && !S.over) { S.lives = 0; S.over = true; gameOver(); }
  updateHUD();
}

function findTarget(t, range, mode, groundOnly) {
  let best = null;
  for (const e of S.enemies) {
    if (e.dead || e.hidden || (groundOnly && e.flying) || Math.hypot(e.x - t.x, e.y - t.y) > range) continue;
    if (!best) best = e;
    else if (mode === 'strong' ? e.hp > best.hp : e.dist > best.dist) best = e;
  }
  return best;
}
function enemiesInRange(x, y, range) { return S.enemies.filter(e => !e.dead && !e.hidden && Math.hypot(e.x - x, e.y - y) <= range); }

function fire(t, def, st, target) {
  const dmg = (st.dmg || 0) * t.buffMul;
  const mx = t.x + Math.cos(t.angle) * 24, my = t.y - 10 + Math.sin(t.angle) * 24;
  if (def.barrel) S.particles.push({ kind: 'flash', x: mx, y: my, life: .08, max: .08, size: 10, color: def.light });

  if (def.kind === 'proj') {
    const targets = st.multi
      ? enemiesInRange(t.x, t.y, st.range).sort((a, b) => b.dist - a.dist).slice(0, st.multi)
      : [target];
    for (const tg of targets) {
      S.bullets.push({ bullet: def.bullet, x: mx, y: my, target: tg, speed: st.speed, st, dmg, def, angle: t.angle });
    }
  } else if (def.kind === 'pierce') {
    S.bullets.push({ pierce: true, x: mx, y: my, vx: Math.cos(t.angle), vy: Math.sin(t.angle), speed: st.speed, dmg, traveled: 0, maxDist: st.range + 40, hit: new Set(), spin: 0 });
  } else if (def.kind === 'beam') {
    damage(target, dmg);
    S.beams.push({ x1: mx, y1: my, x2: target.x, y2: target.y, life: .18, max: .18, color: def.color, w: 4 + t.level * 2 });
    impact(target.x, target.y, def.light, 18);
    if (t.type === 'sniper') S.shake = Math.max(S.shake, 2);
  } else if (def.kind === 'chain') {
    const hit = [target];
    let cur = target;
    while (hit.length < st.chain) {
      let next = null, nd = st.chainRange;
      for (const e of S.enemies) {
        if (e.dead || e.hidden || hit.includes(e)) continue;
        const d = Math.hypot(e.x - cur.x, e.y - cur.y);
        if (d < nd) { nd = d; next = e; }
      }
      if (!next) break;
      hit.push(next); cur = next;
    }
    let px = t.x, py = t.y - 14;
    hit.forEach((e, i) => {
      S.beams.push({ x1: px, y1: py, x2: e.x, y2: e.y, life: .2, max: .2, color: '#fde047', w: 4, zig: true });
      px = e.x; py = e.y;
      damage(e, dmg * Math.pow(0.85, i));
      impact(e.x, e.y, '#fef9c3', 12);
    });
  } else if (def.kind === 'aura') {
    for (const e of enemiesInRange(t.x, t.y, st.range)) { if (!e.flying) { damage(e, dmg); applyEffects(e, st); } }
    if (def.fx === 'flame') {
      for (let i = 0; i < 5; i++) {
        const a = Math.random() * Math.PI * 2, sp = st.range * (1.3 + Math.random());
        S.particles.push({ kind: 'dot', x: t.x, y: t.y - 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .35, max: .35, color: ['#ef4444', '#f97316', '#fde047'][i % 3], size: 7, round: true });
      }
    } else if (def.fx === 'ring' || def.fx === 'slam') {
      S.particles.push({ kind: 'ring', x: t.x, y: t.y, life: .4, max: .4, radius: st.range, color: def.fx === 'ring' ? '#e0f2fe' : '#fef3c7', lw: 6 });
      if (def.fx === 'ring') for (let i = 0; i < 10; i++) {
        const a = Math.random() * 7, rr2 = Math.random() * st.range;
        S.particles.push({ kind: 'star', x: t.x + Math.cos(a) * rr2, y: t.y + Math.sin(a) * rr2, life: .5, max: .5, size: 4, color: '#fff' });
      }
      if (def.shake) S.shake = Math.max(S.shake, def.shake);
    } else if (def.fx === 'vortex') {
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * 7;
        S.particles.push({ kind: 'dot', x: t.x + Math.cos(a) * st.range, y: t.y + Math.sin(a) * st.range, pull: true, tx: t.x, ty: t.y - 10, life: .6, max: .6, color: '#a78bfa', size: 4, round: true });
      }
    }
  }
}

function applyEffects(e, st) {
  if (e.dead) return;
  const boss = e.type === 'boss';
  if (st.slow) { e.slowMul = Math.min(e.slowMul, st.slow); e.slowTime = Math.max(e.slowTime, st.slowDur); }
  if (st.poison) { e.poison = Math.max(e.poisonTime > 0 ? e.poison : 0, st.poison); e.poisonTime = st.poisonDur; }
  if (st.stun) e.stunTime = Math.max(e.stunTime, st.stun * (boss ? .3 : 1));
  if (st.knock) e.dist = Math.max(0, e.dist - st.knock * (boss ? .3 : 1));
  if (st.bounty) e.marked = true;
}

function damage(e, dmg, quiet) {
  if (e.dead) return;
  if (e.armor) dmg *= 1 - e.armor;
  e.hp -= dmg;
  if (!quiet) {
    e.hitFlash = .08;
    if (dmg >= 40) addText(e.x + (Math.random() - .5) * 16, e.y - e.r - 6, Math.round(dmg), '#fff', dmg >= 200 ? 24 : 17, .7, true);
  }
  if (e.hp <= 0) e.dead = true;
}

function hitBullet(b, x, y) {
  const st = b.st;
  if (st.splash) {
    for (const e of enemiesInRange(x, y, st.splash)) { damage(e, b.dmg); applyEffects(e, st); }
    S.particles.push({ kind: 'ring', x, y, life: .3, max: .3, radius: st.splash, color: b.bullet === 'fireball' ? '#fdba74' : '#fff', lw: 5 });
    impact(x, y, b.bullet === 'fireball' ? '#f97316' : '#fde047', st.splash * .5);
    burst(x, y, b.bullet === 'fireball' ? '#f97316' : '#fb923c', 14);
    if (b.def.shake) S.shake = Math.max(S.shake, b.def.shake);
  } else {
    if (!b.target.dead) { damage(b.target, b.dmg); applyEffects(b.target, st); }
    const col = { ice: '#bae6fd', poison: '#bef264', gem: '#fbcfe8', wind: '#ccfbf1' }[b.bullet] || '#fef9c3';
    impact(x, y, col, 10);
  }
}

// ================= 이펙트 =================
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    S.particles.push({ kind: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4 + Math.random() * .3, max: .7, color, size: 3 + Math.random() * 4, round: true });
  }
}
function impact(x, y, color, size) { S.particles.push({ kind: 'impact', x, y, life: .15, max: .15, size, color, rot: Math.random() }); }
function poof(e) {
  const big = e.type === 'boss';
  S.particles.push({ kind: 'ring', x: e.x, y: e.y, life: .35, max: .35, radius: e.r * 2.2, color: '#fff', lw: 4 });
  for (let i = 0; i < (big ? 16 : 6); i++) {
    const a = Math.random() * 7, s = 80 + Math.random() * 150;
    S.particles.push({ kind: 'star', x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, max: .6, size: 5 + Math.random() * 4, color: i % 2 ? '#fff' : e.light });
  }
  burst(e.x, e.y, e.color, big ? 24 : 8);
  if (big) { S.shake = Math.max(S.shake, 10); S.banner = { text: 'BOSS DOWN!', sub: '👑 보스 처치!', age: 0, life: 1.6, color: '#fde047' }; }
}
function addText(x, y, text, color, size, life, dmgNum) { S.texts.push({ x, y, text: String(text), color, size, life, max: life, age: 0, dmgNum }); }

// ================= 그리기 =================
function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate((Math.random() - .5) * S.shake * 2, (Math.random() - .5) * S.shake * 2);
  ctx.drawImage(bg, 0, 0);
  const tm = performance.now() / 1000;

  // 구름 그림자
  ctx.fillStyle = 'rgba(30,27,75,0.07)';
  for (let i = 0; i < 3; i++) {
    const x = ((tm * (12 + i * 5) + i * 400) % (W + 400)) - 200, y = 90 + i * 180;
    ctx.beginPath(); ctx.ellipse(x, y, 110, 40, 0, 0, 7); ctx.ellipse(x + 70, y + 15, 80, 32, 0, 0, 7); ctx.fill();
  }

  // 출발 포탈
  const sp = { x: 22, y: pathPts[0].y };
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = ['#a855f7', '#c084fc', '#f0abfc'][i]; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 20 - i * 5, tm * (3 + i) + i, tm * (3 + i) + i + 4.2); ctx.stroke();
  }
  // 성
  const cx = W - 26, cy = pathPts[pathPts.length - 1].y;
  ctx.font = `46px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏰', cx, cy - 6 + Math.sin(tm * 2) * 2);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy - 30); ctx.lineTo(cx, cy - 50); ctx.stroke();
  ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.moveTo(cx, cy - 50);
  ctx.quadraticCurveTo(cx + 9, cy - 48 + Math.sin(tm * 6) * 3, cx + 18, cy - 45); ctx.lineTo(cx, cy - 40); ctx.fill(); ctx.stroke();

  // 설치 미리보기
  if (S.selectedType && S.hover) {
    const { c, r } = S.hover;
    const ok = canBuild(c, r);
    const x = c * T + T / 2, y = r * T + T / 2;
    const range = TOWERS[S.selectedType].levels[0].range;
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.18)' : 'rgba(239,68,68,0.2)';
    ctx.strokeStyle = ok ? '#fff' : '#ef4444'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(x, y, range, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    rr(c * T + 3, r * T + 3, T - 6, T - 6, 8);
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.35)' : 'rgba(239,68,68,0.45)'; ctx.fill();
    if (ok) { ctx.globalAlpha = .6; ctx.font = `26px ${EMOJI}`; ctx.fillText(TOWERS[S.selectedType].icon, x, y); ctx.globalAlpha = 1; }
  }
  if (S.selectedTower) {
    const t = S.selectedTower, range = TOWERS[t.type].levels[t.level].range;
    ctx.fillStyle = 'rgba(253,224,71,0.13)'; ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.setLineDash([10, 6]);
    ctx.lineDashOffset = -tm * 20;
    ctx.beginPath(); ctx.arc(t.x, t.y, range, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  }

  // 타워 + 적 (위에서 아래 순서로)
  const objs = [...S.towers.map(t => ({ y: t.y, t })), ...S.enemies.map(e => ({ y: e.y, e }))].sort((a, b) => a.y - b.y);
  for (const o of objs) o.t ? drawTower(o.t) : drawEnemy(o.e);

  // 투사체
  for (const b of S.bullets) drawBullet(b);
  // 광선
  for (const b of S.beams) {
    const k = b.life / b.max;
    ctx.globalAlpha = k; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1);
    if (b.zig) for (let i = 1; i < 6; i++) {
      const q = i / 6;
      ctx.lineTo(b.x1 + (b.x2 - b.x1) * q + (Math.random() - .5) * 16, b.y1 + (b.y2 - b.y1) * q + (Math.random() - .5) * 16);
    }
    ctx.lineTo(b.x2, b.y2);
    ctx.strokeStyle = OUT; ctx.lineWidth = b.w + 4; ctx.stroke();
    ctx.strokeStyle = b.color; ctx.lineWidth = b.w; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = b.w / 3; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 파티클
  for (const p of S.particles) {
    const k = Math.max(0, p.life / p.max);
    ctx.globalAlpha = Math.min(1, k * 1.5);
    if (p.kind === 'dot') {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, 7); ctx.fill();
    } else if (p.kind === 'star') {
      starPath(p.x, p.y, 4, p.size * (0.5 + k * 0.5), p.size * .35, (1 - k) * 3);
      ctx.fillStyle = p.color; ctx.fill();
    } else if (p.kind === 'ring') {
      ctx.strokeStyle = p.color; ctx.lineWidth = p.lw * k;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * (1 - k * .8), 0, 7); ctx.stroke();
    } else if (p.kind === 'impact') {
      const s = p.size * (1.4 - k * .6);
      starPath(p.x, p.y, 8, s, s * .45, p.rot);
      ctx.fillStyle = p.color; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      starPath(p.x, p.y, 8, s * .5, s * .2, p.rot); ctx.fillStyle = '#fff'; ctx.fill();
    } else if (p.kind === 'flash') {
      starPath(p.x, p.y, 6, p.size, p.size * .4, 0);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 글자
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of S.texts) {
    const sc = t.age < .15 ? easeOutBack(t.age / .15) : 1;
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2.5);
    ctx.font = `${Math.round(t.size * sc)}px ${FONT}`;
    ctx.lineWidth = 5; ctx.strokeStyle = OUT; ctx.lineJoin = 'round';
    ctx.strokeText(t.text, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  if (S.banner) drawBanner(S.banner);
  ctx.restore();

  if (S.paused && !S.over) {
    ctx.fillStyle = 'rgba(30,27,75,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.font = `56px ${FONT}`; ctx.lineWidth = 8; ctx.strokeStyle = OUT;
    ctx.strokeText('일시정지', W / 2, H / 2); ctx.fillStyle = '#fff'; ctx.fillText('일시정지', W / 2, H / 2);
  }
}

function drawBanner(b) {
  const inT = Math.min(1, b.age / .3), outT = Math.max(0, (b.age - b.life + .3) / .3);
  const slide = (1 - easeOutBack(inT)) * -W + outT * outT * W;
  const y = H / 2;
  ctx.save();
  ctx.translate(slide, 0);
  ctx.fillStyle = 'rgba(30,27,75,0.8)';
  ctx.beginPath(); ctx.moveTo(-20, y - 44); ctx.lineTo(W + 20, y - 58); ctx.lineTo(W + 20, y + 40); ctx.lineTo(-20, y + 54); ctx.fill();
  // 집중선
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const ly = y - 40 + i * 6.5, off = (b.age * 900 + i * 137) % (W + 200) - 100;
    ctx.beginPath(); ctx.moveTo(off, ly); ctx.lineTo(off + 60 + (i % 3) * 40, ly - 2); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = `60px ${FONT}`;
  ctx.lineWidth = 10; ctx.strokeStyle = OUT; ctx.strokeText(b.text, W / 2, y - 10);
  ctx.fillStyle = b.color; ctx.fillText(b.text, W / 2 + 3, y - 7);
  ctx.fillStyle = '#fff'; ctx.fillText(b.text, W / 2, y - 10);
  ctx.font = `22px ${FONT}`; ctx.fillStyle = '#fde68a'; ctx.fillText(b.sub, W / 2, y + 30);
  ctx.restore();
}

function drawTower(t) {
  const def = TOWERS[t.type];
  const age = S.time - t.born;
  const sc = easeOutBack(Math.min(1, Math.max(0.01, age / .35)));
  const tm = S.time;
  ctx.save();
  ctx.translate(t.x, t.y); ctx.scale(sc, sc);

  // 그림자 + 받침대
  ctx.fillStyle = 'rgba(30,27,75,0.3)'; ctx.beginPath(); ctx.ellipse(0, 16, 21, 7, 0, 0, 7); ctx.fill();
  rr(-19, -2, 38, 18, 8); ctx.fillStyle = '#a16207'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
  rr(-19, -8, 38, 16, 8); ctx.fillStyle = '#fde68a'; ctx.fill(); ctx.stroke();

  // 특수 효과
  if (t.type === 'buff') {
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -tm * 30;
    ctx.beginPath(); ctx.arc(0, -8, 24, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  if (t.type === 'blackhole') {
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = ['#7c3aed', '#a78bfa', '#ddd6fe'][i]; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, -10, 22 - i * 4, -tm * (4 + i) + i * 2, -tm * (4 + i) + i * 2 + 3.5); ctx.stroke();
    }
  }
  if (t.type === 'fire' || t.type === 'dragon') {
    const g = ctx.createRadialGradient(0, -10, 2, 0, -10, 30 + Math.sin(tm * 12) * 3);
    g.addColorStop(0, 'rgba(251,146,60,0.55)'); g.addColorStop(1, 'rgba(251,146,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -10, 34, 0, 7); ctx.fill();
  }
  if (t.buffMul > 1) {
    ctx.fillStyle = '#fbbf24'; ctx.font = `12px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('▲', 17, -24 + Math.sin(tm * 5) * 2);
  }

  const bob = Math.sin(tm * 3 + t.c * 1.3) * 1.5;
  const slam = t.type === 'hammer' ? -t.kick * 6 : 0;
  // 포신
  if (def.barrel) {
    ctx.save(); ctx.translate(0, -10 + bob); ctx.rotate(t.angle);
    const k = t.kick * 5;
    const bl = t.type === 'sniper' ? 30 : t.type === 'cannon' || t.type === 'missile' ? 20 : 24;
    const bw = t.type === 'cannon' || t.type === 'missile' || t.type === 'dragon' ? 11 : 7;
    rr(4 - k, -bw / 2, bl, bw, 3); ctx.fillStyle = def.dark; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }
  // 몸통
  const R = 13 + t.level * 1.8;
  const by = -10 + bob + slam;
  const g = ctx.createRadialGradient(-5, by - 6, 2, 0, by, R);
  g.addColorStop(0, def.light); g.addColorStop(1, def.color);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, by, R, 0, 7); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(-R * .4, by - R * .45, R * .3, R * .18, -.6, 0, 7); ctx.fill();
  // 아이콘
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${15 + t.level * 2}px ${EMOJI}`;
  ctx.fillText(def.icon, 0, by + 1);
  // 금광 반짝이
  if (t.type === 'mine' && (tm * 1.3 + t.c) % 2 < .3) {
    starPath(10, by - 12, 4, 6, 2, tm * 3); ctx.fillStyle = '#fff'; ctx.fill();
  }
  ctx.restore();

  // 레벨 별
  ctx.font = `13px ${FONT}`; ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.textAlign = 'center';
  const stars = '★'.repeat(t.level + 1);
  ctx.strokeText(stars, t.x, t.y + 19); ctx.fillStyle = '#fde047'; ctx.fillText(stars, t.x, t.y + 19);
}

function slimePath(r) {
  ctx.beginPath();
  ctx.moveTo(-r, r * .55);
  ctx.bezierCurveTo(-r * 1.05, -r * 1.25, r * 1.05, -r * 1.25, r, r * .55);
  ctx.quadraticCurveTo(0, r * .85, -r, r * .55);
  ctx.closePath();
}

function drawEnemy(e) {
  const tm = S.time;
  const frozen = e.stunTime > 0;
  const ph = frozen ? 0 : tm * 10 * e.slowMul + e.id * 1.7;
  const hop = Math.abs(Math.sin(ph));
  const sq = 1 + (hop - .5) * .14;
  const r = e.r;
  const y = e.flying ? e.y - 16 + Math.sin(tm * 6 + e.id) * 4 : e.y - hop * 5;

  ctx.fillStyle = 'rgba(30,27,75,0.3)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y + r * .65, r * (e.flying ? .6 : 1 - hop * .2), r * (e.flying ? .2 : .3), 0, 0, 7); ctx.fill();

  ctx.save();
  if (e.hidden) ctx.globalAlpha = .28;
  if (e.dashT > 0) ctx.globalAlpha = .9;
  ctx.translate(e.x, y); ctx.scale(1 / sq, sq);
  ctx.lineWidth = 2.5; ctx.strokeStyle = OUT; ctx.lineJoin = 'round';

  // 날개 (박쥐)
  if (e.type === 'bat') {
    const flap = Math.sin(tm * 22 + e.id) * .5;
    for (const s of [-1, 1]) {
      ctx.save(); ctx.scale(s, 1); ctx.rotate(flap);
      ctx.beginPath(); ctx.moveTo(r * .6, -r * .2);
      ctx.lineTo(r * 1.9, -r * .9); ctx.lineTo(r * 1.6, -r * .1); ctx.lineTo(r * 1.9, r * .3); ctx.lineTo(r * 1.2, r * .1); ctx.lineTo(r * .7, r * .4);
      ctx.closePath(); ctx.fillStyle = '#4c1d95'; ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  // 귀 (빠른 적)
  if (e.type === 'fast') {
    for (const s of [-1, 1]) {
      ctx.save(); ctx.rotate(s * (.25 + Math.sin(ph) * .1));
      ctx.beginPath(); ctx.ellipse(s * r * .35, -r * 1.25, r * .22, r * .6, 0, 0, 7);
      ctx.fillStyle = e.color; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(s * r * .35, -r * 1.2, r * .1, r * .4, 0, 0, 7); ctx.fillStyle = '#fda4af'; ctx.fill();
      ctx.restore();
    }
  }
  // 몸
  if (e.type === 'ghost') {
    ctx.beginPath();
    ctx.moveTo(-r, r * .6); ctx.bezierCurveTo(-r * 1.05, -r * 1.3, r * 1.05, -r * 1.3, r, r * .6);
    for (let i = 0; i < 4; i++) {
      const x0 = r - (i + .5) * r / 2, w = Math.sin(tm * 8 + i) * r * .15;
      ctx.quadraticCurveTo(x0, r * 1.05 + w, r - (i + 1) * r / 2, r * .6);
    }
    ctx.closePath();
  } else slimePath(r);
  const g = ctx.createRadialGradient(-r * .35, -r * .5, 1, 0, 0, r * 1.2);
  g.addColorStop(0, e.light); g.addColorStop(.7, e.color); g.addColorStop(1, e.dark);
  ctx.fillStyle = e.hitFlash > 0 ? '#fff' : g; ctx.fill(); ctx.stroke();
  if (e.slowMul < 1) { ctx.fillStyle = 'rgba(125,211,252,0.45)'; ctx.fill(); }
  if (e.poisonTime > 0) { ctx.fillStyle = 'rgba(163,230,53,0.35)'; ctx.fill(); }
  // 광택
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(-r * .45, -r * .55, r * .22, r * .12, -.7, 0, 7); ctx.fill();

  // 머리 장식
  if (e.type === 'normal') {
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.ellipse(r * .15, -r * 1.05, r * .3, r * .14, -.5 + Math.sin(ph) * .2, 0, 7); ctx.fill(); ctx.stroke();
  } else if (e.type === 'tank') {
    ctx.beginPath(); ctx.arc(0, -r * .25, r * .95, Math.PI * 1.08, Math.PI * 1.92);
    ctx.fillStyle = '#94a3b8'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(0, -r * 1.05, r * .12, 0, 7); ctx.fill(); ctx.stroke();
  } else if (e.type === 'boss') {
    ctx.font = `${r}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👑', 0, -r * 1.05);
  } else if (e.type === 'healer') {
    // 간호모자 + 십자
    rr(-r * .45, -r * 1.25, r * .9, r * .45, 4); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-r * .07, -r * 1.2, r * .14, r * .35); ctx.fillRect(-r * .18, -r * 1.09, r * .36, r * .13);
  } else if (e.type === 'knight') {
    // 투구 + 깃털
    ctx.beginPath(); ctx.arc(0, -r * .2, r * .98, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fillStyle = '#cbd5e1'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -r * 1.25, r * .15, r * .4, Math.sin(ph) * .2, 0, 7); ctx.fillStyle = '#ef4444'; ctx.fill(); ctx.stroke();
  } else if (e.type === 'troll') {
    // 뿔
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * r * .45, -r * .75); ctx.quadraticCurveTo(s * r * .9, -r * 1.3, s * r * .75, -r * 1.45); ctx.lineTo(s * r * .25, -r * .85);
      ctx.closePath(); ctx.fillStyle = '#fef3c7'; ctx.fill(); ctx.stroke();
    }
  } else if (e.type === 'splitter') {
    // 가운데 갈라진 선
    ctx.strokeStyle = e.dark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -r * .95); ctx.lineTo(-r * .12, -r * .7); ctx.lineTo(r * .1, -r * .5); ctx.stroke();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.5;
  } else if (e.type === 'dasher') {
    // 머리띠
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-r * .95, -r * .62, r * 1.9, r * .2);
    ctx.beginPath(); ctx.moveTo(r * .9, -r * .55); ctx.lineTo(r * 1.5, -r * .8 + Math.sin(ph * 2) * 3); ctx.lineTo(r * 1.5, -r * .35); ctx.closePath(); ctx.fill();
  }

  // 눈
  const lx = e.dx * r * .12, ly = e.dy * r * .1;
  const blink = !frozen && ((tm * .7 + e.id * .37) % 3) < .1;
  for (const s of [-1, 1]) {
    const ex = s * r * .36 + lx, ey = -r * .1 + ly;
    if (frozen) {
      ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ex - r * .15, ey - r * .12); ctx.lineTo(ex + r * .15, ey + r * .12);
      ctx.moveTo(ex + r * .15, ey - r * .12); ctx.lineTo(ex - r * .15, ey + r * .12); ctx.stroke();
    } else if (blink) {
      ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ex - r * .17, ey); ctx.quadraticCurveTo(ex, ey + r * .12, ex + r * .17, ey); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, r * .21, r * .28, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = e.type === 'boss' ? '#7f1d1d' : '#1e1b4b';
      ctx.beginPath(); ctx.ellipse(ex + e.dx * r * .05, ey + r * .04 + e.dy * r * .05, r * .14, r * .19, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - r * .05, ey - r * .06, r * .065, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + r * .06, ey + r * .1, r * .035, 0, 7); ctx.fill();
    }
    // 볼터치
    ctx.fillStyle = 'rgba(244,114,182,0.55)';
    ctx.beginPath(); ctx.ellipse(s * r * .62, r * .22, r * .15, r * .08, 0, 0, 7); ctx.fill();
  }
  // 눈썹(보스)
  if (e.type === 'boss') {
    ctx.strokeStyle = OUT; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-r * .6, -r * .5); ctx.lineTo(-r * .15, -r * .35);
    ctx.moveTo(r * .6, -r * .5); ctx.lineTo(r * .15, -r * .35); ctx.stroke();
  }
  // 입
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.8;
  ctx.beginPath();
  if (e.hitFlash > 0 || frozen) ctx.arc(lx, r * .3, r * .1, 0, 7);
  else { ctx.moveTo(lx - r * .12, r * .25); ctx.quadraticCurveTo(lx - r * .06, r * .35, lx, r * .25); ctx.quadraticCurveTo(lx + r * .06, r * .35, lx + r * .12, r * .25); }
  ctx.stroke();
  ctx.restore();

  // 상태 아이콘
  if (frozen) {
    for (let i = 0; i < 3; i++) {
      const a = tm * 6 + i * 2.09;
      starPath(e.x + Math.cos(a) * r * .9, y - r * 1.3 + Math.sin(a) * 3, 5, 5, 2, 0);
      ctx.fillStyle = '#fde047'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  if (e.armor) { ctx.font = `12px ${EMOJI}`; ctx.textAlign = 'center'; ctx.fillText('🛡️', e.x - r, y); }
  if (e.marked) { ctx.font = `12px ${EMOJI}`; ctx.textAlign = 'center'; ctx.fillText('💎', e.x + r, y - r); }

  // 체력바
  const bw = Math.max(26, r * 2.2), pct = Math.max(0, e.hp / e.maxHp), hy = y - r * 1.35 - (e.type === 'boss' ? 14 : 6);
  rr(e.x - bw / 2 - 1.5, hy - 1.5, bw + 3, 8, 4); ctx.fillStyle = OUT; ctx.fill();
  if (pct > 0) {
    rr(e.x - bw / 2, hy, bw * pct, 5, 2.5);
    ctx.fillStyle = pct > .5 ? '#4ade80' : pct > .25 ? '#facc15' : '#f87171'; ctx.fill();
  }
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.lineWidth = 2; ctx.strokeStyle = OUT;
  if (b.pierce) {
    ctx.rotate(b.spin);
    ctx.font = `22px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪃', 0, 0);
    ctx.restore(); return;
  }
  ctx.rotate(b.angle);
  switch (b.bullet) {
    case 'arrow':
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#e5e7eb'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(3, -4); ctx.lineTo(3, 4); ctx.fill();
      ctx.fillStyle = '#f472b6'; ctx.fillRect(-13, -3, 4, 6);
      break;
    case 'ball':
      ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-2, -2, 2, 0, 7); ctx.fill();
      break;
    case 'ice':
      starPath(0, 0, 6, 7, 3, S.time * 8); ctx.fillStyle = '#e0f2fe'; ctx.fill(); ctx.strokeStyle = '#0284c7'; ctx.stroke();
      break;
    case 'poison':
      ctx.fillStyle = '#84cc16'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ecfccb'; ctx.beginPath(); ctx.arc(-2, -2, 2, 0, 7); ctx.fill();
      break;
    case 'bullet':
      ctx.fillStyle = '#fde047'; rr(-6, -2, 12, 4, 2); ctx.fill();
      break;
    case 'missile':
      ctx.font = `20px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.rotate(Math.PI / 4); ctx.fillText('🚀', 0, 0);
      break;
    case 'star':
      starPath(0, 0, 5, 7, 3, S.time * 10); ctx.fillStyle = '#f5d0fe'; ctx.fill(); ctx.stroke();
      break;
    case 'gem':
      ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(0, -6); ctx.lineTo(-7, 0); ctx.lineTo(0, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-1, -2, 1.5, 0, 7); ctx.fill();
      break;
    case 'wind':
      ctx.rotate(S.time * 15);
      ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, 4); ctx.stroke();
      ctx.strokeStyle = '#ccfbf1'; ctx.beginPath(); ctx.arc(0, 0, 4, 2, 6); ctx.stroke();
      break;
    case 'fireball': {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 11);
      g.addColorStop(0, '#fef9c3'); g.addColorStop(.5, '#fb923c'); g.addColorStop(1, '#dc2626');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill(); ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

// ================= 입력 =================
function canBuild(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
  if (pathTiles.has(c + ',' + r)) return false;
  return !S.towers.some(t => t.c === c && t.r === r);
}
function tileFromEvent(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (W / rect.width);
  const y = (ev.clientY - rect.top) * (H / rect.height);
  return { c: Math.floor(x / T), r: Math.floor(y / T) };
}
canvas.addEventListener('pointermove', ev => { S.hover = tileFromEvent(ev); });
canvas.addEventListener('pointerleave', () => { S.hover = null; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); cancelSelection(); });
canvas.addEventListener('pointerdown', ev => {
  if (ev.button === 2 || S.over) return;
  const { c, r } = tileFromEvent(ev);
  S.hover = { c, r };
  const existing = S.towers.find(t => t.c === c && t.r === r);
  if (existing) {
    S.selectedTower = existing; S.selectedType = null;
  } else if (S.selectedType) {
    const def = TOWERS[S.selectedType];
    if (canBuild(c, r) && S.gold >= def.cost) {
      S.gold -= def.cost;
      const x = c * T + T / 2, y = r * T + T / 2;
      S.towers.push({ type: S.selectedType, c, r, x, y, level: 0, cd: 0, angle: -Math.PI / 2, spent: def.cost, born: S.time, kick: 0, buffMul: 1 });
      S.particles.push({ kind: 'ring', x, y, life: .35, max: .35, radius: 34, color: '#fff', lw: 5 });
      for (let i = 0; i < 6; i++) S.particles.push({ kind: 'star', x, y, vx: (Math.random() - .5) * 200, vy: -Math.random() * 180, grav: 400, life: .6, max: .6, size: 6, color: def.light });
      if (S.gold < def.cost) S.selectedType = null;
    } else if (S.gold < def.cost) {
      addText(c * T + T / 2, r * T, '골드 부족!', '#f87171', 18, .8);
    }
  } else {
    S.selectedTower = null;
  }
  renderShop(); renderInfo(); updateHUD();
});
function cancelSelection() { S.selectedType = null; S.selectedTower = null; renderShop(); renderInfo(); }

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') cancelSelection();
  else if (/^[0-9]$/.test(ev.key)) selectType(TOWER_LIST[(+ev.key + 9) % 10].id);
  else if (ev.key === ' ') { ev.preventDefault(); startWave(); }
  else if (ev.key === 'p' || ev.key === 'P') togglePause();
  else if (ev.key === 'f' || ev.key === 'F') cycleSpeed();
  else if ((ev.key === 'u' || ev.key === 'U') && S.selectedTower) upgradeTower();
});

function selectType(type) {
  if (S.over) return;
  S.selectedType = S.selectedType === type ? null : type;
  S.selectedTower = null;
  renderShop(); renderInfo();
}
function upgradeTower() {
  const t = S.selectedTower;
  if (!t || t.level >= 2) return;
  const cost = upgradeCost(t);
  if (S.gold < cost) return;
  S.gold -= cost; t.spent += cost; t.level++; t.born = S.time - .15;
  S.particles.push({ kind: 'ring', x: t.x, y: t.y, life: .4, max: .4, radius: 40, color: '#fde047', lw: 6 });
  for (let i = 0; i < 10; i++) S.particles.push({ kind: 'star', x: t.x, y: t.y, vx: (Math.random() - .5) * 220, vy: -Math.random() * 220, grav: 400, life: .7, max: .7, size: 6, color: '#fde047' });
  addText(t.x, t.y - 30, 'LEVEL UP!', '#fde047', 18, 1);
  renderInfo(); updateHUD();
}
function sellTower() {
  const t = S.selectedTower;
  if (!t) return;
  const v = sellValue(t);
  S.gold += v;
  addText(t.x, t.y, `+${v}`, '#fde047', 16, .8);
  burst(t.x, t.y, '#fde68a', 12);
  S.towers = S.towers.filter(x => x !== t);
  S.selectedTower = null;
  renderInfo(); updateHUD();
}

// ================= UI =================
const $ = id => document.getElementById(id);
function statText(def, st) {
  if (def.kind === 'mine') return `웨이브 클리어마다 💰${st.income}`;
  if (def.kind === 'buff') return `주변 타워 공격력 +${Math.round(st.buff * 100)}% · 범위 ${st.range}`;
  const p = [`공격 ${st.dmg}`, `사거리 ${st.range}`, `초당 ${(1 / st.rate).toFixed(1)}회`];
  if (st.splash) p.push(`폭발 ${st.splash}`);
  if (st.slow) p.push(`감속 ${Math.round((1 - st.slow) * 100)}%`);
  if (st.poison) p.push(`독 ${st.poison}/초`);
  if (st.chain) p.push(`연쇄 ${st.chain}`);
  if (st.multi) p.push(`동시 ${st.multi}발`);
  if (st.stun) p.push(`기절 ${st.stun}초`);
  if (st.knock) p.push(`넉백 ${st.knock}`);
  if (st.bounty) p.push('골드 2배');
  if (def.kind === 'pierce') p.push('관통');
  return p.join(' · ');
}
function renderShop() {
  $('shopList').innerHTML = TOWER_LIST.map((d, i) => {
    const cls = ['shop', S.selectedType === d.id ? 'sel' : '', S.gold < d.cost ? 'poor' : ''].join(' ');
    return `<div class="${cls}" data-k="${d.id}" title="${d.desc}">${i < 10 ? `<span class="hk">${(i + 1) % 10}</span>` : ''}<span class="ic">${d.icon}</span><span class="nm">${d.name}</span><span class="ct">💰${d.cost}</span></div>`;
  }).join('');
  document.querySelectorAll('.shop').forEach(el => {
    el.onclick = () => selectType(el.dataset.k);
    el.onmouseenter = () => { const d = TOWERS[el.dataset.k]; $('desc').textContent = `${d.icon} ${d.name}: ${d.desc} — ${statText(d, d.levels[0])}`; };
  });
  if (S.selectedType) { const d = TOWERS[S.selectedType]; $('desc').textContent = `${d.icon} ${d.name}: ${d.desc} — ${statText(d, d.levels[0])}`; }
}
function renderInfo() {
  const box = $('info');
  const t = S.selectedTower;
  if (!t) { box.style.display = 'none'; return; }
  const def = TOWERS[t.type], st = def.levels[t.level];
  const up = t.level < 2
    ? `<button id="upBtn" ${S.gold < upgradeCost(t) ? 'disabled' : ''} title="다음: ${statText(def, def.levels[t.level + 1])}">⬆ 업그레이드 💰${upgradeCost(t)}</button>`
    : '<span style="color:#fde047">★ 최대 레벨</span>';
  box.innerHTML = `<span class="t">${def.icon} ${def.name} ${'★'.repeat(t.level + 1)}</span>
    <span class="d">${statText(def, st)}</span>
    ${up}<button id="sellBtn">판매 +💰${sellValue(t)}</button>`;
  box.style.display = 'flex';
  if ($('upBtn')) $('upBtn').onclick = upgradeTower;
  $('sellBtn').onclick = sellTower;
}
let lastHud = '';
function updateHUD() {
  if (infiniteGold) S.gold = 999999;
  $('lives').textContent = S.lives;
  $('gold').textContent = infiniteGold ? '∞' : S.gold;
  $('wave').textContent = S.wave;
  $('score').textContent = S.score;
  $('waveBtn').disabled = S.waveActive || S.over || S.wave >= MAX_WAVE;
  $('waveBtn').textContent = S.waveActive ? '전투 중...' : S.autoTimer > 0 ? `${Math.ceil(S.autoTimer)}초 후 시작` : '다음 웨이브 ▶';
  const key = S.gold + '|' + (S.selectedTower ? S.selectedTower.level : '');
  if (key !== lastHud) {
    lastHud = key;
    document.querySelectorAll('.shop').forEach(el => el.classList.toggle('poor', S.gold < TOWERS[el.dataset.k].cost));
    const up = $('upBtn');
    if (up && S.selectedTower) up.disabled = S.gold < upgradeCost(S.selectedTower);
  }
}
function togglePause() {
  if (S.over) return;
  S.paused = !S.paused;
  $('pauseBtn').textContent = S.paused ? '▶' : '⏸';
}
$('pauseBtn').onclick = togglePause;
const SPEEDS = [1, 2, 3, 5, 10];
function cycleSpeed() {
  S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length];
  $('speedBtn').textContent = `x${S.speed}`;
  $('speedBtn').classList.toggle('on', S.speed > 1);
}
$('speedBtn').onclick = () => {
  cycleSpeed();
};
$('waveBtn').onclick = startWave;
function syncAutoBtn() {
  $('autoBtn').textContent = S.autoWave ? '🔁 연속 ON' : '🔁 연속 OFF';
  $('autoBtn').classList.toggle('on', S.autoWave);
}
$('autoBtn').onclick = () => {
  if (S.over) return;
  S.autoWave = !S.autoWave;
  syncAutoBtn();
  if (S.autoWave && !S.waveActive) startWave();
  if (!S.autoWave) S.autoTimer = 0;
};
$('codeBtn').onclick = () => {
  const code = (prompt('치트 코드를 입력하세요') || '').trim();
  if (!code) return;
  if (code === '방탄유리') {
    infiniteGold = true; lastHud = '';
    S.banner = { text: 'CHEAT ON', sub: '💰 돈 무한 활성화!', age: 0, life: 1.8, color: '#fde047' };
  } else {
    addText(W / 2, H / 2, '잘못된 코드', '#f87171', 26, 1.2);
  }
  updateHUD(); renderShop(); renderInfo();
};

function getBest() { try { return +localStorage.getItem('defence-best') || 0; } catch { return 0; } }
function setBest(v) { try { localStorage.setItem('defence-best', v); } catch {} }

function showOverlay(title, text, btn, onClick) {
  $('ovTitle').textContent = title; $('ovText').innerHTML = text; $('ovBtn').textContent = btn;
  $('ovBtn').onclick = () => { $('overlay').style.display = 'none'; onClick(); };
  $('overlay').style.display = 'flex';
}
function victory() {
  const best = Math.max(getBest(), S.score); setBest(best);
  S.banner = { text: 'VICTORY!', sub: '🏆 100 웨이브 클리어!', age: 0, life: 3, color: '#fde047' };
  setTimeout(() => showOverlay('🏆 승리!', `100 웨이브를 모두 막아냈어요!<br>남은 생명 <b>${S.lives}</b> · 점수 <b>${S.score}</b> · 최고 점수 <b>${best}</b>`, '다시 하기', () => {
    resetGame(); $('speedBtn').textContent = 'x1'; $('speedBtn').classList.remove('on'); $('pauseBtn').textContent = '⏸'; syncAutoBtn();
  }), 1500);
}
function gameOver() {
  const best = Math.max(getBest(), S.score); setBest(best);
  showOverlay('💀 게임 오버', `웨이브 <b>${S.wave}</b>까지 버텼어요!<br>점수 <b>${S.score}</b> · 최고 점수 <b>${best}</b>`, '다시 하기', () => {
    resetGame(); $('speedBtn').textContent = 'x1'; $('speedBtn').classList.remove('on'); $('pauseBtn').textContent = '⏸'; syncAutoBtn();
  });
}

// ================= 루프 =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!S.paused && !S.over) for (let i = 0; i < S.speed; i++) update(dt);
  else if (S.over && S.banner) { S.banner.age += dt; if (S.banner.age > S.banner.life) S.banner = null; }
  draw();
  requestAnimationFrame(loop);
}

resetGame();
showOverlay('🏰 디펜스 게임 ✨',
  `귀여운 슬라임 군단이 성으로 몰려와요!<br>
   <b>20종의 타워</b>로 막아내세요!<br>
   ${TOWER_LIST.map(d => d.icon).join(' ')}<br>
   총 <b>100 웨이브</b> · 5웨이브마다 👑 보스<br>🦇 박쥐 · 💚 힐러 · 🫧 분열 · 🛡️ 기사 · 👻 유령 · 💪 트롤 · 💨 돌진 등장!<br>최고 점수 <b>${getBest()}</b>`,
  '게임 시작!', () => {});
requestAnimationFrame(loop);
</script>
